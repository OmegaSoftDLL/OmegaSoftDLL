<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 140 140" width="100%" height="100%">
  <defs>
    <radialGradient id="odsi-bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#111C38"/>
      <stop offset="65%" stop-color="#090F1E"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="odsi-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="odsi-omega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="odsi-lambda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="odsi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes odsiPulse {
        0%, 100% { transform: translate(80px, 80px) scale(1.0) translate(-80px, -80px); }
        50% { transform: translate(80px, 80px) scale(1.035) translate(-80px, -80px); }
      }
      @keyframes odsiOrbit {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .odsi-core { animation: odsiPulse 4s ease-in-out infinite; }
      .odsi-ring { animation: odsiOrbit 12s linear infinite; }
    </style>
  </defs>

  <!-- Full-Bleed Circular Medallion -->
  <circle cx="80" cy="80" r="67" fill="url(#odsi-bg)" stroke="url(#odsi-rim)" stroke-width="4.5"/>
  <circle cx="80" cy="80" r="61" fill="none" stroke="url(#odsi-rim)" stroke-width="1.4" stroke-dasharray="10 6" class="odsi-ring" opacity="0.85"/>

  <!-- Quantum &amp; Neural Hexagonal Grid Lattice -->
  <polygon points="80,22 130,51 130,109 80,138 30,109 30,51" fill="none" stroke="#1E293B" stroke-width="1.2" opacity="0.8"/>
  <line x1="80" y1="22" x2="80" y2="138" stroke="#00E5FF" stroke-width="0.7" opacity="0.25"/>
  <line x1="30" y1="51" x2="130" y2="109" stroke="#8B5CF6" stroke-width="0.7" opacity="0.25"/>
  <line x1="130" y1="51" x2="30" y2="109" stroke="#10B981" stroke-width="0.7" opacity="0.25"/>

  <g class="odsi-core" filter="url(#odsi-glow)">
    <!-- Monumental Omega (Ω) Sovereign Arch -->
    <path d="M 40 116 L 62 116 L 62 103 C 46 94 38 76 42 57 C 46 39 62 28 80 28 C 98 28 114 39 118 57 C 122 76 114 94 98 103 L 98 116 L 120 116"
          fill="none" stroke="url(#odsi-omega)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Quantum/Lambda (λ) Verified Core -->
    <polygon points="80,44 102,80 80,106 58,80" fill="#0B132B" stroke="url(#odsi-lambda)" stroke-width="2.2" opacity="0.95"/>
    <path d="M 71 60 L 80 73 L 70 93 M 80 73 L 90 93"
          fill="none" stroke="url(#odsi-lambda)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 4 Sovereign Pillar Nodes (AI, Compilers/Prover, Quantum, Systems) -->
    <circle cx="80" cy="28" r="4.2" fill="#00E5FF"/>
    <circle cx="41" cy="68" r="3.8" fill="#10B981"/>
    <circle cx="119" cy="68" r="3.8" fill="#8B5CF6"/>
    <circle cx="80" cy="106" r="3.8" fill="#F59E0B"/>
  </g>
</svg>