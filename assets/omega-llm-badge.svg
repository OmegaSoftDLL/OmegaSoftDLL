<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 13 134 134" width="160" height="160" role="img" aria-label="Omega LLM — Sovereign Neural Core Badge">
  <defs>
    <radialGradient id="omegaCoreBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="omegaRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="omegaGlyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="omegaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orbit-ring { transform-origin: 80px 80px; animation: spinRing 18s linear infinite; }
      .pulse-node { animation: pulseNode 2.8s ease-in-out infinite; }
      @keyframes spinRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulseNode { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-ring, .pulse-node { animation: none; }
      }
    </style>
  </defs>

  <circle cx="80" cy="80" r="64" fill="url(#omegaCoreBg)" stroke="url(#omegaRingGrad)" stroke-width="3.5"/>
  <circle cx="80" cy="80" r="56" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 4" class="orbit-ring"/>

  <!-- Neural mesh lines -->
  <g stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.45">
    <line x1="80" y1="28" x2="45" y2="55"/>
    <line x1="80" y1="28" x2="115" y2="55"/>
    <line x1="45" y1="55" x2="36" y2="96"/>
    <line x1="115" y1="55" x2="124" y2="96"/>
    <line x1="45" y1="55" x2="115" y2="55"/>
  </g>

  <!-- Glowing Omega (Ω) Neural Emblem -->
  <g filter="url(#omegaGlow)">
    <path d="M 50 112 L 66 112 L 66 103 C 54 96 48 83 48 69 C 48 50 62 36 80 36 C 98 36 112 50 112 69 C 112 83 106 96 94 103 L 94 112 L 110 112"
          fill="none" stroke="url(#omegaGlyphGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Neural Core Nodes -->
  <circle cx="80" cy="36" r="4" fill="#00E5FF" class="pulse-node"/>
  <circle cx="48" cy="69" r="3.5" fill="#A855F7" class="pulse-node"/>
  <circle cx="112" cy="69" r="3.5" fill="#A855F7" class="pulse-node"/>
  <circle cx="80" cy="72" r="6" fill="#FBBF24" filter="url(#omegaGlow)" class="pulse-node"/>
  <circle cx="50" cy="112" r="3.5" fill="#00E5FF"/>
  <circle cx="110" cy="112" r="3.5" fill="#00E5FF"/>

  <text x="80" y="131" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.4">OMEGA LLM</text>
</svg>
